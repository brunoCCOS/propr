name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: propr
            asset_name: propr-linux-x86_64
          - os: macos-latest
            artifact_name: propr
            asset_name: propr-macos-x86_64
          - os: windows-latest
            artifact_name: propr.exe
            asset_name: propr-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build release binary
        run: cargo build --release

      - name: Rename binary
        shell: bash
        run: cp target/release/${{ matrix.artifact_name }} target/release/${{ matrix.asset_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.asset_name }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Install git-cliff
        run: cargo install git-cliff

      - name: Generate CHANGELOG.md
        run: git-cliff -o CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: update CHANGELOG for ${{ github.ref_name }}"
          git push

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*/*
          name: ${{ github.ref_name }}
          generate_release_notes: true
